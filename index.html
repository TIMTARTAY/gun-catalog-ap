<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#111827">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icon-192.png">
  <title>Firearm Catalog</title>
  <style>
    :root {
      --bg: #f3f4f6;
      --card: #ffffff;
      --text: #111827;
      --muted: #6b7280;
      --dark: #111827;
      --blue: #1d4ed8;
      --red: #991b1b;
      --green-bg: #ecfdf5;
      --green-border: #10b981;
      --border: #d1d5db;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: var(--bg);
      color: var(--text);
    }

    header {
      background: var(--dark);
      color: white;
      padding: 18px 14px;
      text-align: center;
      position: sticky;
      top: 0;
      z-index: 5;
    }

    header h1 {
      margin: 0;
      font-size: 24px;
    }

    header p {
      margin: 5px 0 0;
      color: #d1d5db;
      font-size: 14px;
    }

    main {
      max-width: 950px;
      margin: auto;
      padding: 14px;
      padding-bottom: 60px;
    }

    .card {
      background: var(--card);
      border-radius: 14px;
      padding: 14px;
      margin-bottom: 14px;
      box-shadow: 0 2px 10px rgba(0,0,0,.12);
    }

    h2, h3 {
      margin-top: 0;
    }

    label {
      display: block;
      margin-top: 12px;
      font-weight: 700;
    }

    input, select, textarea, button {
      width: 100%;
      padding: 13px;
      margin-top: 6px;
      border-radius: 10px;
      border: 1px solid var(--border);
      font-size: 16px;
      background: white;
    }

    textarea { resize: vertical; }

    button {
      background: var(--dark);
      color: white;
      border: none;
      font-weight: 700;
      margin-top: 12px;
      cursor: pointer;
    }

    button:active { transform: scale(.99); }

    .secondary { background: #4b5563; }
    .blue { background: var(--blue); }
    .danger { background: var(--red); }

    .row {
      display: grid;
      grid-template-columns: 1fr;
      gap: 10px;
    }

    @media (min-width: 700px) {
      .row { grid-template-columns: 1fr 1fr; }
    }

    .hidden { display: none; }

    .status {
      background: var(--green-bg);
      border: 1px solid var(--green-border);
      padding: 10px;
      border-radius: 10px;
      margin-top: 12px;
      font-size: 14px;
    }

    .item {
      border-top: 1px solid var(--border);
      padding-top: 14px;
      margin-top: 14px;
    }

    .accessory {
      background: #f3f4f6;
      padding: 10px;
      border-radius: 10px;
      margin-top: 8px;
      border: 1px solid #e5e7eb;
    }

    .muted {
      color: var(--muted);
      font-size: 14px;
    }

    .pill {
      display: inline-block;
      background: #e5e7eb;
      padding: 4px 8px;
      border-radius: 999px;
      font-size: 13px;
      margin-bottom: 6px;
    }

    .top-actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    .install-box {
      background: #eff6ff;
      border: 1px solid #93c5fd;
      border-radius: 10px;
      padding: 10px;
      margin-top: 10px;
      font-size: 14px;
    }
  </style>
</head>
<body>
<header>
  <h1>Firearm Catalog</h1>
  <p>Rifle • Pistol • Suppressor • Accessories</p>
</header>

<main>
  <div class="card">
    <h2 id="formTitle">Add Item</h2>
    <input type="hidden" id="editIndex">

    <div class="row">
      <div>
        <label for="itemType">Item Type</label>
        <select id="itemType">
          <option value="">Select type</option>
          <option value="Rifle">Rifle</option>
          <option value="Pistol">Pistol</option>
          <option value="Suppressor">Suppressor</option>
        </select>
      </div>

      <div>
        <label for="condition">Condition</label>
        <select id="condition">
          <option value="">Optional</option>
          <option value="New">New</option>
          <option value="Used">Used</option>
          <option value="Excellent">Excellent</option>
          <option value="Good">Good</option>
          <option value="Fair">Fair</option>
        </select>
      </div>
    </div>

    <div class="row">
      <div>
        <label for="itemName">Name / Model</label>
        <input id="itemName" placeholder="Example: Glock 19">
      </div>

      <div>
        <label for="itemSerial">Serial Number</label>
        <input id="itemSerial" placeholder="Enter serial number">
      </div>
    </div>

    <div class="row">
      <div>
        <label for="caliber">Caliber / Gauge</label>
        <input id="caliber" placeholder="Example: 9mm, .223, 12ga">
      </div>

      <div>
        <label for="purchaseDate">Purchase Date</label>
        <input id="purchaseDate" type="date">
      </div>
    </div>

    <label for="notes">Notes</label>
    <textarea id="notes" rows="3" placeholder="Optional notes"></textarea>

    <div id="accessorySection" class="hidden">
      <h3>Accessories</h3>

      <div class="row">
        <div>
          <label for="accessoryType">Accessory Type</label>
          <select id="accessoryType">
            <option value="">Select accessory</option>
            <option value="Scope">Scope</option>
            <option value="Red Dot">Red Dot</option>
            <option value="Light">Light</option>
            <option value="Laser">Laser</option>
            <option value="Grip">Grip</option>
            <option value="Sling">Sling</option>
            <option value="Magazine">Magazine</option>
            <option value="Bipod">Bipod</option>
            <option value="Muzzle Device">Muzzle Device</option>
            <option value="Case">Case</option>
            <option value="Other">Other</option>
          </select>
        </div>

        <div>
          <label for="accessoryName">Accessory Model / Name</label>
          <input id="accessoryName" placeholder="Example: Holosun 507C">
        </div>
      </div>

      <label for="accessorySerial">Accessory Serial Number</label>
      <input id="accessorySerial" placeholder="Enter serial number or N/A">

      <button type="button" id="addAccessoryBtn">Add Accessory</button>
      <div id="accessoryList"></div>
    </div>

    <button type="button" id="saveBtn">Save Item</button>
    <button type="button" id="clearBtn" class="secondary">Clear Form</button>

    <div id="status" class="status">Ready.</div>
  </div>

  <div class="card">
    <h2>Search</h2>
    <input id="searchBox" placeholder="Search by name, serial, type, caliber, or accessory">
  </div>

  <div class="card">
    <h2>Backup / Transfer</h2>
    <div class="top-actions">
      <button type="button" id="exportBtn">Export Backup</button>
      <button type="button" id="printBtn" class="secondary">Print / Save PDF</button>
    </div>

    <label for="importFile">Import Backup File</label>
    <input id="importFile" type="file" accept=".json">

    <div class="install-box">
      <strong>Install on phone:</strong><br>
      iPhone: open this app link in Safari → Share → Add to Home Screen.<br>
      Android: open in Chrome → menu ⋮ → Add to Home Screen.
    </div>
  </div>

  <div class="card">
    <h2>Saved Items</h2>
    <p class="muted" id="countText"></p>
    <div id="itemsList"></div>
  </div>
</main>

<script>
(function () {
  var catalog = [];
  var accessories = [];
  var storageKey = "firearmCatalogInstallableV1";

  function el(id) { return document.getElementById(id); }

  function safe(text) {
    return String(text || "")
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#039;");
  }

  function status(text) {
    el("status").textContent = text;
  }

  function loadCatalog() {
    try {
      var saved = localStorage.getItem(storageKey);
      catalog = saved ? JSON.parse(saved) : [];
      if (!Array.isArray(catalog)) catalog = [];
    } catch (e) {
      catalog = [];
      status("Storage could not load. Use Export Backup often.");
    }
  }

  function saveCatalog() {
    try {
      localStorage.setItem(storageKey, JSON.stringify(catalog));
    } catch (e) {
      alert("Your browser blocked saving. Export a backup before closing.");
    }
  }

  function updateAccessorySection() {
    var type = el("itemType").value;
    if (type === "Rifle" || type === "Pistol") {
      el("accessorySection").classList.remove("hidden");
    } else {
      el("accessorySection").classList.add("hidden");
      accessories = [];
      renderAccessories();
    }
  }

  function addAccessory() {
    var type = el("accessoryType").value;
    var name = el("accessoryName").value.trim();
    var serial = el("accessorySerial").value.trim();

    if (!type) {
      alert("Select an accessory type.");
      return;
    }
    if (!name) {
      alert("Enter the accessory model/name.");
      return;
    }

    accessories.push({
      type: type,
      name: name,
      serial: serial || "N/A"
    });

    el("accessoryType").value = "";
    el("accessoryName").value = "";
    el("accessorySerial").value = "";
    renderAccessories();
    status("Accessory added.");
  }

  window.removeAccessory = function (index) {
    accessories.splice(index, 1);
    renderAccessories();
    status("Accessory removed.");
  };

  function renderAccessories() {
    var html = "";
    for (var i = 0; i < accessories.length; i++) {
      var a = accessories[i];
      html += "<div class='accessory'>" +
        "<strong>" + safe(a.type) + ": " + safe(a.name) + "</strong><br>" +
        "Serial: " + safe(a.serial || "N/A") +
        "<button type='button' class='danger' onclick='removeAccessory(" + i + ")'>Remove</button>" +
        "</div>";
    }
    el("accessoryList").innerHTML = html;
  }

  function getFormItem() {
    var type = el("itemType").value;
    var name = el("itemName").value.trim();
    var serial = el("itemSerial").value.trim();

    if (!type) {
      alert("Select Rifle, Pistol, or Suppressor.");
      return null;
    }
    if (!name) {
      alert("Enter the name/model.");
      return null;
    }
    if (!serial) {
      alert("Enter the serial number.");
      return null;
    }

    return {
      type: type,
      name: name,
      serial: serial,
      caliber: el("caliber").value.trim(),
      condition: el("condition").value,
      purchaseDate: el("purchaseDate").value,
      notes: el("notes").value.trim(),
      accessories: (type === "Rifle" || type === "Pistol") ? accessories.slice() : [],
      saved: new Date().toLocaleString()
    };
  }

  function saveItem() {
    var item = getFormItem();
    if (!item) return;

    var editIndex = el("editIndex").value;
    if (editIndex === "") {
      catalog.push(item);
    } else {
      catalog[Number(editIndex)] = item;
    }

    saveCatalog();
    clearForm(false);
    renderItems();
    status("Item saved. Total items: " + catalog.length);
  }

  function clearForm(showMessage) {
    el("formTitle").textContent = "Add Item";
    el("editIndex").value = "";
    el("itemType").value = "";
    el("condition").value = "";
    el("itemName").value = "";
    el("itemSerial").value = "";
    el("caliber").value = "";
    el("purchaseDate").value = "";
    el("notes").value = "";
    el("accessoryType").value = "";
    el("accessoryName").value = "";
    el("accessorySerial").value = "";
    accessories = [];
    updateAccessorySection();
    renderAccessories();
    if (showMessage !== false) status("Form cleared.");
  }

  function renderItems() {
    var query = el("searchBox").value.toLowerCase();
    var html = "";
    var shown = 0;

    for (var i = 0; i < catalog.length; i++) {
      var item = catalog[i];
      var accessoryText = "";
      var itemAccessories = item.accessories || [];

      for (var j = 0; j < itemAccessories.length; j++) {
        var a = itemAccessories[j];
        accessoryText += " " + (a.type || "") + " " + (a.name || "") + " " + (a.serial || "");
      }

      var combined = [
        item.type, item.name, item.serial, item.caliber, item.condition,
        item.purchaseDate, item.notes, accessoryText
      ].join(" ").toLowerCase();

      if (combined.indexOf(query) === -1) continue;

      shown++;

      html += "<div class='item'>" +
        "<span class='pill'>" + safe(item.type) + "</span>" +
        "<h3>" + safe(item.name) + "</h3>" +
        "<p><strong>Serial:</strong> " + safe(item.serial) + "</p>" +
        "<p><strong>Caliber/Gauge:</strong> " + safe(item.caliber || "N/A") + "</p>" +
        "<p><strong>Condition:</strong> " + safe(item.condition || "N/A") + "</p>" +
        "<p><strong>Purchase Date:</strong> " + safe(item.purchaseDate || "N/A") + "</p>" +
        "<p><strong>Notes:</strong> " + safe(item.notes || "None") + "</p>";

      if (itemAccessories.length > 0) {
        html += "<strong>Accessories:</strong>";
        for (var k = 0; k < itemAccessories.length; k++) {
          var acc = itemAccessories[k];
          html += "<div class='accessory'>" +
            safe(acc.type || "Accessory") + ": " + safe(acc.name || "") + "<br>" +
            "Serial: " + safe(acc.serial || "N/A") +
            "</div>";
        }
      } else {
        html += "<p><strong>Accessories:</strong> None</p>";
      }

      html += "<p class='muted'>Saved: " + safe(item.saved || "") + "</p>" +
        "<button type='button' class='blue' onclick='editItem(" + i + ")'>Edit</button>" +
        "<button type='button' class='danger' onclick='deleteItem(" + i + ")'>Delete</button>" +
        "</div>";
    }

    if (catalog.length === 0) html = "<p>No items saved yet.</p>";
    else if (shown === 0) html = "<p>No matching items found.</p>";

    el("itemsList").innerHTML = html;
    el("countText").textContent = "Showing " + shown + " of " + catalog.length + " saved item(s).";
  }

  window.editItem = function (index) {
    var item = catalog[index];

    el("formTitle").textContent = "Edit Item";
    el("editIndex").value = index;
    el("itemType").value = item.type || "";
    el("condition").value = item.condition || "";
    el("itemName").value = item.name || "";
    el("itemSerial").value = item.serial || "";
    el("caliber").value = item.caliber || "";
    el("purchaseDate").value = item.purchaseDate || "";
    el("notes").value = item.notes || "";
    accessories = (item.accessories || []).slice();

    updateAccessorySection();
    renderAccessories();
    window.scrollTo(0, 0);
    status("Editing item.");
  };

  window.deleteItem = function (index) {
    if (confirm("Delete this item?")) {
      catalog.splice(index, 1);
      saveCatalog();
      renderItems();
      status("Item deleted. Total items: " + catalog.length);
    }
  };

  function exportBackup() {
    var data = JSON.stringify(catalog, null, 2);
    var blob = new Blob([data], { type: "application/json" });
    var url = URL.createObjectURL(blob);
    var link = document.createElement("a");
    link.href = url;
    link.download = "firearm_catalog_backup.json";
    document.body.appendChild(link);
    link.click();
    document.body.removeChild(link);
    setTimeout(function () { URL.revokeObjectURL(url); }, 1000);
    status("Backup exported.");
  }

  function importBackup(evt) {
    var file = evt.target.files[0];
    if (!file) return;

    var reader = new FileReader();
    reader.onload = function (e) {
      try {
        var imported = JSON.parse(e.target.result);
        if (!Array.isArray(imported)) {
          alert("Invalid backup file.");
          return;
        }
        if (confirm("Importing will replace the current catalog on this device. Continue?")) {
          catalog = imported;
          saveCatalog();
          renderItems();
          status("Backup imported. Total items: " + catalog.length);
        }
      } catch (err) {
        alert("Could not read backup file.");
      }
    };
    reader.readAsText(file);
  }

  function printCatalog() {
    window.print();
  }

  el("itemType").addEventListener("change", updateAccessorySection);
  el("addAccessoryBtn").addEventListener("click", addAccessory);
  el("saveBtn").addEventListener("click", saveItem);
  el("clearBtn").addEventListener("click", function () { clearForm(true); });
  el("searchBox").addEventListener("input", renderItems);
  el("exportBtn").addEventListener("click", exportBackup);
  el("importFile").addEventListener("change", importBackup);
  el("printBtn").addEventListener("click", printCatalog);

  if ("serviceWorker" in navigator) {
    window.addEventListener("load", function () {
      navigator.serviceWorker.register("service-worker.js").catch(function () {});
    });
  }

  loadCatalog();
  updateAccessorySection();
  renderItems();
  status("Ready. Loaded items: " + catalog.length);
})();
</script>
</body>
</html>
